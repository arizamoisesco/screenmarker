name: Ejecutables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller==6.22.0
      # Carpeta + ZIP: es el formato recomendado en Windows. El .exe único se
      # descomprime en %TEMP% al arrancar, y cuando el antivirus bloquea esa
      # extracción Qt no encuentra sus plugins y la app falla al iniciar.
      - run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name screenmarker --collect-submodules pynput
          --collect-submodules screenmarker --paths .
          --version-file installer/windows_version.txt installer/entry.py
      - run: Compress-Archive -Path dist/screenmarker/* -DestinationPath dist/screenmarker-windows-x64.zip
      # Versión con consola: si algo falla, el error queda a la vista.
      - run: >
          pyinstaller --noconfirm --clean --onedir --console
          --name screenmarker-debug --collect-submodules pynput
          --collect-submodules screenmarker --paths .
          --version-file installer/windows_version.txt installer/entry.py
      - run: Compress-Archive -Path dist/screenmarker-debug/* -DestinationPath dist/screenmarker-windows-x64-debug.zip
      # `--help` sale de argparse antes de crear la ventana: si el paquete
      # screenmarker no quedó dentro del ejecutable, esto falla aquí y no en el
      # PC de quien lo descarga.
      - run: ./dist/screenmarker-debug/screenmarker-debug.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: screenmarker-windows-x64
          path: dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/screenmarker-windows-x64.zip
            dist/screenmarker-windows-x64-debug.zip
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Qt necesita estas bibliotecas y evdev (pynput) se compila desde el código.
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - run: pip install -r requirements.txt pyinstaller==6.22.0
      - run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name screenmarker --collect-submodules pynput
          --collect-submodules screenmarker --paths . installer/entry.py
      - run: mv dist/screenmarker dist/screenmarker-linux-x86_64
      - run: ./dist/screenmarker-linux-x86_64 --help
      - uses: actions/upload-artifact@v4
        with:
          name: screenmarker-linux-x86_64
          path: dist/screenmarker-linux-x86_64
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/screenmarker-linux-x86_64
          generate_release_notes: true
