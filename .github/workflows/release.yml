name: Ejecutables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: screenmarker-linux-x86_64
          - os: windows-latest
            artifact: screenmarker-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Qt necesita estas bibliotecas y evdev (pynput) se compila desde el código.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - run: pip install -r requirements.txt pyinstaller==6.22.0
      - run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name screenmarker --collect-submodules pynput packaging/entry.py
      - if: runner.os == 'Linux'
        run: mv dist/screenmarker "dist/${{ matrix.artifact }}"
      - if: runner.os == 'Windows'
        run: Rename-Item dist/screenmarker.exe "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          generate_release_notes: true
